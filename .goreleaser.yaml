homebrew_casks:
  - name: weather-cli
    homepage: "https://github.com/cybo42/weather-cli"
    description: "A simple CLI application that prints hello world"
    license: "MIT"
    directory: Casks

    binaries:
      - wea
    hooks:
      post:
        # replace foo with the actual binary name
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/weather-cli"]
            end

    url:
      # URL which is determined by the given Token (github, gitlab or gitea).
      #
      # Default depends on the client.
      # Templates: allowed.
      # https://github.com/cybo42/weather-cli2/releases/download/v1.2.8/weather-cli2_Darwin_x86_64.tar.gz
      template: "https://github.com/cybo42/weather-cli2/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
      verified: "github.com/cybo42/weather-cli2/"
      using: ":homebrew_curl"


release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
